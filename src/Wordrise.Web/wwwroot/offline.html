<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14213D" />
  <title>Can't connect · Wordrise</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" />
  <link rel="stylesheet" href="/css/site.css" />
  <script src="/js/theme.js"></script>
</head>
<body class="public">
  <main class="main">
    <section class="card hero narrow center" style="--rise:.3">
      <img src="/icons/icon-192.png" alt="" width="64" height="64" style="border-radius:16px" />
      <h1>We can't reach Wordrise</h1>
      <p class="hero-meta">Check your internet connection. If you are online, the server may be down or restarting.</p>
      <p class="hero-meta">Your progress is safe. Try again in a moment.</p>
      <button type="button" class="btn btn-accent" id="retry">Try again</button>
    </section>
  </main>
  <script src="/js/offline.js"></script>
</body>
</html>
